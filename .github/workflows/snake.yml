# Genera la culebrita que se come el gráfico de contribuciones, con los colores de la marca.
# Se actualiza sola cada día y se publica en la rama "output".
name: Culebrita de contribuciones

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-claro.svg?color_snake=#6E5398&color_dots=#F3EEF6,#E3D6EE,#C3B3D4,#A28AC4,#6E5398
            dist/snake-oscuro.svg?color_snake=#F7B6C2&color_dots=#1F1926,#3B2E4A,#6E5398,#A28AC4,#C9B9DD

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
